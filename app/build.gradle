plugins {
    id 'com.android.application'
}

android {
    namespace 'com.alomari.slaypuzzle'
    compileSdk 34

    defaultConfig {
        applicationId "com.alomari.slaypuzzle"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
// بدون أي مكتبات خارجية - المشروع يعمل بالكامل بدون إنترنت (ما عدا تحميل Gradle نفسه)
